<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback</title>
  <style>
    :root {
      --bg: #070d12;
      --cyan: #00ffd5;
      --blue: #00aaff;
      --text: #e8f9ff;
      --danger: #ff5577;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #0d2230 0%, var(--bg) 60%) fixed;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 500px; padding: 28px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(0,255,213,.2);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,170,255,.08);
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { margin: 0 0 8px; opacity: .7; font-size: 14px; }

    label { display: block; margin: 16px 0 6px; font-size: 14px; opacity: .85; }
    label small { opacity: .6; }
    input[type="email"], select, textarea {
      width: 100%; padding: 12px;
      background: rgba(255,255,255,.05); color: inherit;
      border: 1px solid rgba(0,255,213,.3); border-radius: 10px;
      font: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    select option { background: #0a1218; color: var(--text); }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0,255,213,.35);
    }
    [aria-invalid="true"] { border-color: var(--danger); }

    /* Star rating (written 5 -> 1 so hover/checked fills stars to the left) */
    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; }
    .stars input { position: absolute; opacity: 0; pointer-events: none; }
    .stars label {
      margin: 0; font-size: 34px; line-height: 1; cursor: pointer;
      color: rgba(255,255,255,.2);
      transition: color .15s, transform .1s;
    }
    .stars label:hover,
    .stars label:hover ~ label,
    .stars input:checked ~ label {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0,255,213,.6);
    }
    .stars label:hover { transform: scale(1.15); }
    .stars input:focus-visible + label { outline: 2px solid var(--blue); border-radius: 4px; }

    button {
      margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 10px;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      color: #001018; font: inherit; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .err { color: var(--danger); font-size: 13px; }
    [data-fs-success] { color: var(--cyan); margin-bottom: 12px; }
    [data-fs-error]:empty { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Send feedback</h1>
    <p class="sub">Tell me what's working and what isn't.</p>

    <div data-fs-success></div>
    <div data-fs-error class="err"></div>

    <!-- action/method = no-JS fallback; the script below takes over when loaded -->
    <form id="feedback-form" action="https://formspree.io/f/xkjrpooo" method="POST">
      <input type="hidden" name="_subject" value="New feedback" />

      <label>How would you rate it?</label>
      <div class="stars">
        <input type="radio" id="s5" name="rating" value="5" required /><label for="s5" title="5 stars">★</label>
        <input type="radio" id="s4" name="rating" value="4" /><label for="s4" title="4 stars">★</label>
        <input type="radio" id="s3" name="rating" value="3" /><label for="s3" title="3 stars">★</label>
        <input type="radio" id="s2" name="rating" value="2" /><label for="s2" title="2 stars">★</label>
        <input type="radio" id="s1" name="rating" value="1" /><label for="s1" title="1 star">★</label>
      </div>
      <span data-fs-error="rating" class="err"></span>

      <label for="category">Type</label>
      <select id="category" name="category" data-fs-field>
        <option value="General">General feedback</option>
        <option value="Bug">Bug report</option>
        <option value="Idea">Feature idea</option>
        <option value="Design">Design / looks</option>
      </select>

      <label for="message">Your feedback</label>
      <textarea id="message" name="message" rows="5" data-fs-field required
        placeholder="What's working? What's not?"></textarea>
      <span data-fs-error="message" class="err"></span>

      <label for="email">Email <small>(optional, only if you want a reply)</small></label>
      <input type="email" id="email" name="email" data-fs-field />
      <span data-fs-error="email" class="err"></span>

      <button type="submit" data-fs-submit-btn>Send feedback</button>
    </form>
  </main>

  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#feedback-form', formId: 'xkjrpooo' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
